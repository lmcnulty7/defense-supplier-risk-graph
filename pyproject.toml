[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-graph"
version = "0.1.0"
description = "Defense supplier-risk knowledge graph from public contract data, with a cited agent and an evaluation harness (portfolio project; fictional customer persona)."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "duckdb>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "networkx>=3.2",
  "rapidfuzz>=3.6",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "streamlit>=1.35",
  "pyvis>=0.3",
  "neo4j>=5.20",
  "pycountry>=23.12",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # works even if macOS hides the editable-install .pth file
markers = [
  "data: needs the staged DuckDB / graph built by `make data graph`",
  "live: calls the Anthropic API (costs money); skipped unless RUN_LIVE=1",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
